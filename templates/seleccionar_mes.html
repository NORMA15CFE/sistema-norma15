<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Mes a Reportar - CFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f4; font-family: Arial, sans-serif; }
        .card-custom { max-width: 450px; margin: 60px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 3px 10px rgba(0,0,0,0.08); border-top: 5px solid #006633; }
        .btn-cfe { background-color: #006633; color: white; font-weight: bold; }
        .btn-cfe:hover { background-color: #004d26; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-custom">
            <h4 class="text-success fw-bold mb-3 text-center" style="color: #006633 !important;">Generar Orden de Pago</h4>
            <p class="text-muted text-center mb-4">Alumno: <strong>{{ alumno[2] }}</strong></p>
            
            <form action="/generar_orden_pago/{{ alumno[0] }}" method="POST">
                <div class="mb-3">
                    <label for="mes_reportado" class="form-label fw-semibold">Seleccione el mes correspondiente al periodo:</label>
                    <select name="mes_reportado" id="mes_reportado" class="form-select" required>
                        {% for m in meses %}
                            <option value="{{ m.valor }}">{{ m.texto }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-cfe py-2">Generar y Descargar Orden</button>
                    <a href="/dashboard" class="btn btn-secondary py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
