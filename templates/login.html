<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Sistema CFE Norma 15</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .header-banner { background-color: #006633; color: white; text-align: center; padding: 25px 20px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        .header-banner img { max-height: 50px; margin-bottom: 10px; }
        .header-banner h1 { font-size: 26px; font-weight: bold; margin: 0; }
        .header-banner p { font-size: 14px; margin: 5px 0 0 0; letter-spacing: 0.5px; }
        .login-card { max-width: 420px; margin: 30px auto 20px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        .btn-cfe { background-color: #006633; color: white; font-weight: bold; border-radius: 4px; }
        .btn-cfe:hover { background-color: #004d26; color: white; }
    </style>
</head>
<body>
    <div class="header-banner">
        <img src="{{ url_for('static', filename='logo_cfe.jpg') }}" alt="Logo CFE" onerror="this.style.display='none'">
        <h1>Comisión Federal de Electricidad</h1>
        <p>Norma 15 - Control de Alumnos</p>
    </div>

    <div class="container text-center">
        <div class="login-card text-start">
            <h4 class="text-success fw-bold mb-3 text-center" style="color: #006633 !important;">Iniciar Sesión por Zona</h4>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger py-2 small text-center" role="alert">
                  {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-semibold">Contraseña de Acceso:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña (Ej. DJ000, DJ020...)" required autofocus>
                </div>
                <button type="submit" class="btn btn-cfe w-100 py-2">Entrar al Sistema</button>
            </form>
        </div>

        <div class="mt-3 mb-5">
            <img src="{{ url_for('static', filename='buhonorm15.png') }}" alt="Búho CFE Norma 15" style="max-height: 220px;" class="img-fluid" onerror="this.src='{{ url_for('static', filename='buhocfe.png') }}'">
        </div>
    </div>
</body>
</html>
